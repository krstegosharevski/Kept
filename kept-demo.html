<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kept Routines</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column (max 480px), sticky date header, fixed bottom tab bar like a native iOS app */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#15202A; --muted:#5D6A77; --line:#DCE2E8;
  --accent:#17705B; --accent-ink:#FFFFFF; --accent-soft:#D6ECE5; --heat-empty:#E2E7EC; --danger:#B4373F;
  --rest:#0B0D10; --rest-ink:#B9C2CB; --rest-title:#FFFFFF; --rest-line:#0B0D10;
  --shadow:0 1px 2px rgba(20,32,42,.06),0 4px 14px rgba(20,32,42,.05);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#172029; --ink:#E7ECF1; --muted:#93A0AD; --line:#26313C;
  --accent:#4CC6A2; --accent-ink:#0B1A15; --accent-soft:#16372F; --heat-empty:#202A34; --danger:#F07178;
  --rest:#000000; --rest-ink:#A3AEB9; --rest-title:#EEF2F6; --rest-line:#2B3642;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#172029; --ink:#E7ECF1; --muted:#93A0AD; --line:#26313C;
  --accent:#4CC6A2; --accent-ink:#0B1A15; --accent-soft:#16372F; --heat-empty:#202A34; --danger:#F07178;
  --rest:#000000; --rest-ink:#A3AEB9; --rest-title:#EEF2F6; --rest-line:#2B3642;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 14px;display:flex;align-items:center;gap:14px}
.top .titles{flex:1;min-width:0}
.top h1{font-size:30px;font-weight:800;line-height:1.05}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}
.datenav{display:flex;gap:6px;align-items:center}
.ring{flex:none}
.ring text{font-family:var(--f-mono);font-weight:700;fill:var(--ink)}

.banner{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px}

/* routine list */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:12px 12px 12px 12px;box-shadow:var(--shadow);border:1px solid transparent;text-align:left;width:100%}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--c) 18%,transparent)}
.item .body{flex:1;min-width:0}
.item .name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.item .hint{font-size:13px;color:var(--muted)}
.check{width:40px;height:40px;border-radius:50%;flex:none;border:2.5px solid color-mix(in srgb,var(--c) 55%,var(--line));background:transparent;display:grid;place-items:center;transition:transform .15s,background .15s}
.check svg{opacity:0;transition:opacity .15s}
.item.done .check{background:var(--c);border-color:var(--c)}
.item.done .check svg{opacity:1}
.item.done .name{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.check:active{transform:scale(.88)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}

.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 18px;font-weight:700;width:100%}
.ghost{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-weight:600}
.danger{color:var(--danger)}
.section{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.section > h2{font-size:19px}
.edit{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;padding:8px}

/* segmented */
.seg{display:flex;background:var(--heat-empty);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* stats */
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.rangehead{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.rangehead .lbl{flex:1;font-weight:700;font-size:16px;text-align:center}
.bigpct{display:flex;align-items:baseline;gap:8px}
.bigpct .v{font-family:var(--f-display);font-size:48px;font-weight:800;line-height:1}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin-top:16px}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar .col{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:4px}
.bar.future .col{background:var(--heat-empty)}
.bar .d{font-size:12px;font-weight:700;color:var(--muted)}
.bar .p{font-size:11px;color:var(--muted);min-height:16px;line-height:16px}
.bar .cw{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bar.today .d{color:var(--accent)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:14px}
.heat .h{font-size:11px;text-align:center;color:var(--muted);font-weight:700}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;border:0;font-size:12px;font-family:var(--f-mono);display:grid;place-items:center;background:var(--heat-empty);color:var(--muted);padding:0}
.cell.l1{background:color-mix(in srgb,var(--accent) 28%,var(--heat-empty));color:var(--ink)}
.cell.l2{background:color-mix(in srgb,var(--accent) 52%,var(--heat-empty));color:var(--ink)}
.cell.l3{background:color-mix(in srgb,var(--accent) 76%,var(--heat-empty));color:var(--accent-ink)}
.cell.l4{background:var(--accent);color:var(--accent-ink)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.future{opacity:.45;cursor:default}
.cell.blank{visibility:hidden}
.legend{display:flex;align-items:center;gap:4px;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rstat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.rstat .tile{width:38px;height:38px;font-size:19px;grid-row:span 2}
.rstat .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.rstat .pc{font-family:var(--f-mono);font-weight:700}
.track{height:6px;border-radius:3px;background:var(--heat-empty);overflow:hidden;grid-column:2/4}
.track span{display:block;height:100%;background:var(--c);border-radius:3px}
.dots{display:flex;gap:4px;grid-column:2/4}
.dots i{width:14px;height:14px;border-radius:4px;background:var(--heat-empty);display:inline-block}
.dots i.on{background:var(--c)}
.dots i.off{background:transparent;border:1px dashed var(--line)}
.meta{font-size:13px;color:var(--muted);grid-column:2/4}

/* rest days (Sat & Sun) and locked past days */
.restcard{background:var(--rest);color:var(--rest-ink);border:1px solid var(--rest-line);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;gap:6px}
.restcard h3{color:var(--rest-title);font-size:26px;margin-top:6px}
.restcard p{margin:0;max-width:36ch}
.restbadge{width:64px;height:64px;border-radius:50%;flex:none;background:var(--rest);color:var(--rest-ink);border:1px solid var(--rest-line);display:grid;place-items:center}
.lockline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface);border-radius:12px;padding:9px 12px;margin-bottom:14px}
.lockline svg{flex:none}
.item.locked{box-shadow:none;border-color:var(--line);background:color-mix(in srgb,var(--surface) 55%,var(--bg))}
.status{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;border:2.5px dashed var(--line)}
.item.done .status{background:var(--c);border:2.5px solid var(--c)}
.item.missed .hint{color:var(--danger);font-weight:600}
.bar.rest .col{background:var(--rest);border:1px solid var(--rest-line);border-radius:8px;display:grid;place-items:center}
.bar.rest .col span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--rest-ink)}
.dots i.rest{background:var(--rest);border:1px solid var(--rest-line)}
.cell.rest{background:var(--rest);color:var(--rest-ink);border:1px solid var(--rest-line);cursor:default}
.dayc.rest{display:grid;place-items:center;background:var(--rest);color:var(--rest-ink);border-color:var(--rest-line);cursor:default}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,16,22,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:92%;overflow:auto;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet h2{font-size:22px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lab{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{font-family:var(--f-mono);font-size:12px;min-height:110px}
.picks{display:flex;flex-wrap:wrap;gap:8px}
.emo{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px}
.emo[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);background:var(--c);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.dayc{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.dayc[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:14px}
.stepper .v{font-family:var(--f-mono);font-size:22px;font-weight:700;min-width:2ch;text-align:center}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>

<div class="tabs"><nav id="tabs">
  <button data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="m8 12 3 3 5-6"/></svg>Today</button>
  <button data-tab="routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3" fill="currentColor"/><circle cx="4.5" cy="12" r="1.3" fill="currentColor"/><circle cx="4.5" cy="18" r="1.3" fill="currentColor"/></svg>Routines</button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-9"/></svg>Stats</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke-linecap="round"/></svg>Settings</button>
</nav></div>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
const COLORS=['#1F9D74','#2E7DD7','#7B5CD6','#3A9FB0','#D9822B','#C2417A'];
const EMOJI=['🥗','🏋️','📖','💧','📞','🧘','🛏️','🚶','✍️','🎸','🧹','☀️','🍎','📵','🧠','🌱'];
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS1=['M','T','W','T','F','S','S'];
const DAYS_FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const LS='kept-routines-v1';

/* ---------- dates ---------- */
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dow=d=>(d.getDay()+6)%7;
const isRest=d=>dow(d)>=5; // Saturday and Sunday are fixed rest days
const weekStart=d=>addDays(sod(d),-dow(d));
const TODAY=()=>sod(new Date());
const maxD=(a,b)=>a>b?a:b, minD=(a,b)=>a<b?a:b;

/* ---------- storage ---------- */
function load(){try{const s=localStorage.getItem(LS);return s?normalize(JSON.parse(s)):null}catch(e){return null}}
/* keeps stored data consistent with the rules: no check-ins on rest days, no weekend days in schedules */
function normalize(d){
  if(!d||!Array.isArray(d.routines)||!d.checks||typeof d.checks!=='object') return null;
  for(const k of Object.keys(d.checks)) if(isRest(parse(k))) delete d.checks[k];
  for(const r of d.routines){
    if(r.sched.type==='days'){r.sched.days=r.sched.days.filter(i=>i<5);if(!r.sched.days.length)r.sched={type:'daily'}}
    if(r.sched.type==='weekly') r.sched.target=Math.min(5,Math.max(1,r.sched.target|0));
  }
  return d;
}
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

function seed(){
  const t=TODAY(), created=key(addDays(t,-70));
  const routines=[
    {id:'r1',name:'Eat healthy',emoji:'🥗',color:COLORS[0],sched:{type:'daily'},created},
    {id:'r2',name:'Workout',emoji:'🏋️',color:COLORS[1],sched:{type:'days',days:[0,2,4]},created},
    {id:'r3',name:'Read 20 minutes',emoji:'📖',color:COLORS[2],sched:{type:'daily'},created},
    {id:'r4',name:'Drink 2L water',emoji:'💧',color:COLORS[3],sched:{type:'daily'},created},
    {id:'r5',name:'Call family',emoji:'📞',color:COLORS[4],sched:{type:'weekly',target:2},created},
  ];
  let x=20261028; const rnd=()=>{x=(x*16807)%2147483647;return x/2147483647};
  const p={r1:.68,r2:.78,r3:.55,r4:.82,r5:.3};
  const checks={};
  for(let i=70;i>=1;i--){
    const d=addDays(t,-i), k=key(d), boost=i<25?1.15:.9;
    for(const r of routines){ if(isDue(r,d)&&rnd()<Math.min(.97,p[r.id]*boost)) (checks[k]=checks[k]||[]).push(r.id); }
  }
  if(!isRest(t)) checks[key(t)]=['r1','r4'];
  return {routines,checks,demo:true};
}

let S=load()||seed(); save();
let view='today', viewDate=TODAY(), statMode='week', weekRef=weekStart(TODAY()), monthRef=new Date(TODAY().getFullYear(),TODAY().getMonth(),1);
let edit=null, confirmDel=false, confirmClear=false;

/* ---------- logic ---------- */
function isDue(r,d){
  if(isRest(d)||key(d)<r.created) return false;
  if(r.sched.type==='days') return r.sched.days.includes(dow(d));
  return true;
}
const isDone=(r,k)=>(S.checks[k]||[]).includes(r.id);
function toggle(id,k){
  const a=S.checks[k]||[]; const i=a.indexOf(id);
  if(i>=0)a.splice(i,1);else a.push(id);
  if(a.length)S.checks[k]=a;else delete S.checks[k];
  save();
}
function doneCount(r,a,b){let n=0;for(let d=a;d<=b;d=addDays(d,1))if(isDue(r,d)&&isDone(r,key(d)))n++;return n}
function expected(r,a,b){
  const s=maxD(a,parse(r.created)); if(s>b) return 0;
  if(r.sched.type==='weekly'){let wd=0;for(let d=s;d<=b;d=addDays(d,1))if(!isRest(d))wd++;return wd?Math.max(1,Math.round(r.sched.target*wd/5)):0}
  let n=0;for(let d=s;d<=b;d=addDays(d,1))if(isDue(r,d))n++;return n;
}
function rangeStats(a,b){
  let got=0,exp=0; const per=S.routines.map(r=>{const e=expected(r,a,b),d=doneCount(r,a,b);got+=Math.min(d,e);exp+=e;return{r,e,d,pct:e?Math.min(1,d/e):0}});
  return {pct:exp?got/exp:0,per,exp};
}
function dayRatio(d){
  const due=S.routines.filter(r=>r.sched.type!=='weekly'&&isDue(r,d));
  if(!due.length) return null;
  const k=key(d); return due.filter(r=>isDone(r,k)).length/due.length;
}
const level=v=>v==null||v===0?0:v<.34?1:v<.67?2:v<1?3:4;
function weekDone(r,d){const a=weekStart(d);return doneCount(r,a,addDays(a,6))}
function streaks(r){
  const t=TODAY(), c=parse(r.created);
  if(r.sched.type==='weekly'){
    const met=w=>doneCount(r,w,addDays(w,6))>=r.sched.target;
    let cur=0,w=weekStart(t); if(!met(w)) w=addDays(w,-7);
    while(w>=weekStart(c)&&met(w)){cur++;w=addDays(w,-7)}
    let best=0,run=0; for(let w2=weekStart(c);w2<=weekStart(t);w2=addDays(w2,7)){ if(met(w2)){run++;best=Math.max(best,run)} else if(+w2!==+weekStart(t)) run=0 }
    return {cur,best,unit:'wk'};
  }
  let cur=0; for(let d=t;d>=c;d=addDays(d,-1)){ if(!isDue(r,d))continue; if(isDone(r,key(d)))cur++; else if(+d===+t)continue; else break; }
  let best=0,run=0; for(let d=c;d<=t;d=addDays(d,1)){ if(!isDue(r,d))continue; if(isDone(r,key(d))){run++;best=Math.max(best,run)} else if(+d!==+t) run=0 }
  return {cur,best,unit:'d'};
}
function schedText(r,d){
  const s=r.sched;
  if(s.type==='daily') return 'Mon – Fri';
  if(s.type==='days') return s.days.length>=5?'Mon – Fri':s.days.slice().sort().map(i=>DAYS[i]).join(' · ');
  return d?`${weekDone(r,d)} of ${s.target} this week`:`${s.target}× per week`;
}

/* ---------- render ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CHECK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const MOON='<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const LOCK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const $app=document.getElementById('app');

function ring(done,total){
  const r=24,c=2*Math.PI*r,f=total?done/total:0;
  return `<svg class="ring" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="${done} of ${total} done">
  <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--heat-empty)" stroke-width="7"/>
  <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round"
    stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}" transform="rotate(-90 32 32)" style="transition:stroke-dashoffset .4s"/>
  <text x="32" y="37" text-anchor="middle" font-size="14">${done}/${total}</text></svg>`;
}

function renderToday(){
  const t=TODAY(),d=viewDate,k=key(d),isToday=+d===+t,past=d<t,rest=isRest(d);
  const due=S.routines.filter(r=>isDue(r,d));
  const done=due.filter(r=>isDone(r,k)).length;
  const label=isToday?'Today':(+d===+addDays(t,-1)?'Yesterday':DAYS_FULL[dow(d)]);
  let html=`<header class="top"><div class="titles"><div class="eyebrow">${label}</div><h1>${d.getDate()} ${MONTHS[d.getMonth()]}</h1>
    <div class="datenav" style="margin-top:8px"><button class="iconbtn" data-act="prevDay" aria-label="Previous day">‹</button>
    <button class="iconbtn" data-act="nextDay" aria-label="Next day" ${isToday?'disabled':''}>›</button>
    ${isToday?'':'<button class="edit" data-act="goToday">Back to today</button>'}</div></div>${rest?`<div class="restbadge" aria-hidden="true">${MOON}</div>`:ring(done,due.length)}</header>`;
  if(S.demo) html+=`<div class="banner">You're looking at example data. Reset or clear it in Settings.</div>`;
  if(rest){
    html+=`<div class="restcard">${MOON}<h3>Rest day</h3><p>Saturdays and Sundays are for resting, so there is nothing to check off.${isToday?' Your routines start again on Monday.':''}</p></div>`;
  } else if(!S.routines.length){
    html+=`<div class="empty"><h3>No routines yet</h3><p>Add your first one, like “Eat healthy”, and tick it off each day.</p><button class="primary" data-act="new">Add a routine</button></div>`;
  } else if(!due.length){
    html+=`<div class="empty"><h3>Nothing scheduled</h3><p>No routines are due on this day.</p></div>`;
  } else {
    if(past) html+=`<div class="lockline">${LOCK}Past day, view only. You can only check off today.</div>`;
    html+='<div class="list">'+due.map(r=>{const dn=isDone(r,k);
      const hint=past?(dn?'Completed':(r.sched.type==='weekly'?'Not done':'Missed')):schedText(r,d);
      const ctl=past?`<div class="status" role="img" aria-label="${dn?'Completed':'Not completed'}">${dn?CHECK:''}</div>`
        :`<button class="check" data-act="toggle" data-id="${r.id}" aria-pressed="${dn}" aria-label="Mark ${esc(r.name)} done">${CHECK}</button>`;
      return `<div class="item${dn?' done':''}${past?' locked':''}${past&&!dn&&r.sched.type!=='weekly'?' missed':''}" style="--c:${r.color}">
      <div class="tile">${r.emoji}</div><div class="body"><div class="name">${esc(r.name)}</div><div class="hint">${hint}</div></div>${ctl}</div>`}).join('')+'</div>';
    if(done===due.length) html+=`<p class="muted" style="text-align:center;margin-top:18px">${isToday?'All done for today. Nice work.':'Everything was done on this day.'}</p>`;
  }
  $app.innerHTML=html;
}

function renderRoutines(){
  let html=`<header class="top"><div class="titles"><div class="eyebrow">${S.routines.length} active · weekends off</div><h1>Routines</h1></div></header>`;
  html+='<div class="list">'+S.routines.map(r=>`<button class="item" style="--c:${r.color}" data-act="edit" data-id="${r.id}">
    <div class="tile">${r.emoji}</div><div class="body"><div class="name">${esc(r.name)}</div><div class="hint">${schedText(r)}</div></div>
    <span class="edit">Edit</span></button>`).join('')+'</div>';
  html+=`<div class="section"><button class="primary" data-act="new">+ New routine</button></div>`;
  $app.innerHTML=html;
}

function renderStats(){
  const t=TODAY();
  let html=`<header class="top"><div class="titles"><div class="eyebrow">Progress</div><h1>Statistics</h1></div></header>
  <div class="seg" role="group"><button data-act="mode" data-m="week" aria-pressed="${statMode==='week'}">Week</button><button data-act="mode" data-m="month" aria-pressed="${statMode==='month'}">Month</button></div>`;
  if(!S.routines.length){$app.innerHTML=html+'<div class="empty"><h3>No data yet</h3><p>Add routines and check them off to see stats here.</p></div>';return}
  if(statMode==='week'){
    const a=weekRef,b=addDays(a,6),bEff=minD(b,t);
    const st=rangeStats(a,bEff);
    const isCur=+a===+weekStart(t);
    html+=`<div class="rangehead"><button class="iconbtn" data-act="prevW" aria-label="Previous week">‹</button>
      <div class="lbl">${isCur?'This week':`${a.getDate()} ${MONTHS[a.getMonth()].slice(0,3)} – ${b.getDate()} ${MONTHS[b.getMonth()].slice(0,3)}`}</div>
      <button class="iconbtn" data-act="nextW" aria-label="Next week" ${isCur?'disabled':''}>›</button></div>
    <div class="card"><div class="bigpct"><span class="v">${Math.round(st.pct*100)}%</span><span class="muted">completed</span></div>
    <div class="bars">${[...Array(7)].map((_,i)=>{const d=addDays(a,i),td=+d===+t?' today':'';
      if(isRest(d)) return `<div class="bar rest${td}"><span class="p"></span><div class="cw"><div class="col" style="height:100%"><span>Rest</span></div></div><span class="d">${DAYS1[i]}</span></div>`;
      const fut=d>t,v=fut?null:dayRatio(d),h=v==null?0:Math.round(v*100);
      return `<div class="bar${fut?' future':''}${td}"><span class="p num">${fut||v==null?'':h+'%'}</span><div class="cw"><div class="col" style="height:${fut?4:Math.max(3,h)}%"></div></div><span class="d">${DAYS1[i]}</span></div>`}).join('')}</div></div>
    <div class="section"><h2>By routine</h2><div class="card list" style="gap:16px">${st.per.map(({r,e,d,pct})=>`<div class="rstat" style="--c:${r.color}">
      <div class="tile">${r.emoji}</div><div class="nm">${esc(r.name)}</div><div class="pc">${d}/${r.sched.type==='weekly'?r.sched.target:e}</div>
      <div class="dots">${[...Array(7)].map((_,i)=>{const dd=addDays(a,i);if(isRest(dd))return '<i class="rest"></i>';if(dd>t||!isDue(r,dd))return '<i class="off"></i>';return `<i class="${isDone(r,key(dd))?'on':''}"></i>`}).join('')}</div></div>`).join('')}</div></div>`;
  } else {
    const a=monthRef,b=new Date(a.getFullYear(),a.getMonth()+1,0),bEff=minD(b,t);
    const st=rangeStats(a,bEff);
    const isCur=a.getFullYear()===t.getFullYear()&&a.getMonth()===t.getMonth();
    const off=dow(a);
    let cells=DAYS1.map(x=>`<span class="h">${x}</span>`).join('')+'<span class="cell blank"></span>'.repeat(off);
    for(let d=a;d<=b;d=addDays(d,1)){const td=+d===+t?' today':'';
      if(isRest(d)){cells+=`<span class="cell rest${td}" role="img" aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}, rest day">${d.getDate()}</span>`;continue}
      const fut=d>t,lv=fut?0:level(dayRatio(d));
      cells+=`<button class="cell l${lv}${fut?' future':''}${td}" ${fut?'disabled':`data-act="openDay" data-k="${key(d)}"`} aria-label="${d.getDate()} ${MONTHS[d.getMonth()]}">${d.getDate()}</button>`}
    html+=`<div class="rangehead"><button class="iconbtn" data-act="prevM" aria-label="Previous month">‹</button>
      <div class="lbl">${MONTHS[a.getMonth()]} ${a.getFullYear()}</div>
      <button class="iconbtn" data-act="nextM" aria-label="Next month" ${isCur?'disabled':''}>›</button></div>
    <div class="card"><div class="bigpct"><span class="v">${Math.round(st.pct*100)}%</span><span class="muted">completed this month</span></div>
    <div class="heat">${cells}</div>
    <div class="legend">Less <i style="background:var(--heat-empty)"></i><i class="cell l1" style="width:12px;height:12px;border-radius:3px"></i><i class="cell l2" style="width:12px;height:12px;border-radius:3px"></i><i class="cell l3" style="width:12px;height:12px;border-radius:3px"></i><i style="background:var(--accent)"></i> More<i style="background:var(--rest);margin-left:12px"></i> Rest</div>
    <p class="muted" style="font-size:13px;margin:8px 0 0">Tap a day to see what you did. Black days are rest days.</p></div>
    <div class="section"><h2>By routine</h2><div class="card list" style="gap:16px">${st.per.map(({r,e,d,pct})=>{const s=streaks(r);return `<div class="rstat" style="--c:${r.color}">
      <div class="tile">${r.emoji}</div><div class="nm">${esc(r.name)}</div><div class="pc">${Math.round(pct*100)}%</div>
      <div class="track"><span style="width:${Math.round(pct*100)}%"></span></div>
      <div class="meta"><span class="num">${d}</span> of <span class="num">${e}</span> · streak <span class="num">${s.cur}${s.unit}</span> · best <span class="num">${s.best}${s.unit}</span></div></div>`}).join('')}</div></div>`;
  }
  $app.innerHTML=html;
}

function renderSettings(){
  $app.innerHTML=`<header class="top"><div class="titles"><div class="eyebrow">App</div><h1>Settings</h1></div></header>
  <div class="section"><h2>Backup</h2><p class="muted" style="margin:0">Your data lives only on this device. Copy the backup code and keep it somewhere safe.</p>
    <button class="ghost" data-act="showBackup">Show backup code</button>
    <div id="backupBox" hidden class="field"><textarea id="backupText" readonly></textarea><button class="ghost" data-act="copyBackup">Copy</button></div></div>
  <div class="section"><h2>Restore</h2><div class="field"><label for="restoreText">Paste a backup code</label><textarea id="restoreText" placeholder='{"routines":[...]}'></textarea></div>
    <button class="ghost" data-act="restore">Restore from code</button></div>
  <div class="section"><h2>Data</h2>
    <button class="ghost" data-act="reset">Load example data</button>
    <button class="ghost danger" data-act="clear">${confirmClear?'Tap again to erase everything':'Erase all data'}</button></div>
  <p class="muted" style="font-size:13px;margin-top:24px">Kept · demo version. On iPhone the final app opens from your Home Screen and works offline.</p>`;
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===view?'page':'false'));
  ({today:renderToday,routines:renderRoutines,stats:renderStats,settings:renderSettings})[view]();
}

/* ---------- editor sheet ---------- */
const $sheet=document.getElementById('sheetRoot');
function openEditor(id){
  const r=S.routines.find(x=>x.id===id);
  edit=r?JSON.parse(JSON.stringify(r)):{id:null,name:'',emoji:EMOJI[0],color:COLORS[0],sched:{type:'daily'}};
  if(!edit.sched.days)edit.sched.days=[0,2,4];
  if(!edit.sched.target)edit.sched.target=3;
  confirmDel=false; renderSheet(); setTimeout(()=>{const i=document.getElementById('rname');if(i&&!edit.id)i.focus()},50);
}
function renderSheet(){
  if(!edit){$sheet.innerHTML='';return}
  const s=edit.sched;
  $sheet.innerHTML=`<div class="overlay" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${edit.id?'Edit routine':'New routine'}">
    <div class="row"><button class="edit" data-act="close">Cancel</button><h2>${edit.id?'Edit routine':'New routine'}</h2><button class="edit" data-act="saveR" style="color:var(--accent)">Save</button></div>
    <div class="field"><label for="rname">Name</label><input type="text" id="rname" maxlength="40" placeholder="e.g. Eat healthy" value="${esc(edit.name)}"></div>
    <div class="field"><span class="lab">Icon</span><div class="picks">${EMOJI.map(e=>`<button class="emo" data-act="emo" data-v="${e}" aria-pressed="${edit.emoji===e}">${e}</button>`).join('')}</div></div>
    <div class="field"><span class="lab">Color</span><div class="picks">${COLORS.map(c=>`<button class="sw" style="--c:${c}" data-act="col" data-v="${c}" aria-pressed="${edit.color===c}" aria-label="Color ${c}"></button>`).join('')}</div></div>
    <div class="field"><span class="lab">How often</span><div class="seg">
      <button data-act="stype" data-v="daily" aria-pressed="${s.type==='daily'}">Mon – Fri</button>
      <button data-act="stype" data-v="days" aria-pressed="${s.type==='days'}">Some days</button>
      <button data-act="stype" data-v="weekly" aria-pressed="${s.type==='weekly'}">× per week</button></div>
      ${s.type==='days'?`<div class="picks" style="justify-content:space-between;margin-top:8px">${DAYS1.map((d,i)=>i>=5?`<span class="dayc rest" role="img" aria-label="${DAYS[i]}, rest day">${d}</span>`:`<button class="dayc" data-act="day" data-v="${i}" aria-pressed="${s.days.includes(i)}" aria-label="${DAYS[i]}">${d}</button>`).join('')}</div>`:''}
      ${s.type==='weekly'?`<div class="stepper" style="margin-top:8px"><button class="iconbtn" data-act="tgt" data-v="-1" aria-label="Fewer">−</button><span class="v">${s.target}</span><button class="iconbtn" data-act="tgt" data-v="1" aria-label="More">+</button><span class="muted">times per week</span></div>`:''}
      <p class="muted" style="font-size:13px;margin:4px 0 0">Saturday and Sunday are always rest days.</p>
    </div>
    <button class="primary" data-act="saveR">${edit.id?'Save changes':'Add routine'}</button>
    ${edit.id?`<button class="ghost danger" data-act="delR">${confirmDel?'Tap again to delete with its history':'Delete routine'}</button>`:''}
  </div></div>`;
}
function syncName(){const i=document.getElementById('rname');if(i&&edit)edit.name=i.value}

/* ---------- toast ---------- */
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){view=tab.dataset.tab;confirmClear=false;if(view==='today')viewDate=TODAY();render();window.scrollTo(0,0);return}
  const el=e.target.closest('[data-act]'); if(!el)return;
  const a=el.dataset.act;
  if(a==='closeBg'&&e.target!==el)return;
  switch(a){
    case 'toggle': if(+viewDate!==+TODAY()||isRest(viewDate)){toast('Only today can be checked off');render();break}
      toggle(el.dataset.id,key(viewDate)); render(); break;
    case 'prevDay': viewDate=addDays(viewDate,-1); render(); break;
    case 'nextDay': if(viewDate<TODAY())viewDate=addDays(viewDate,1); render(); break;
    case 'goToday': viewDate=TODAY(); render(); break;
    case 'openDay': viewDate=parse(el.dataset.k); view='today'; render(); window.scrollTo(0,0); break;
    case 'mode': statMode=el.dataset.m; render(); break;
    case 'prevW': weekRef=addDays(weekRef,-7); render(); break;
    case 'nextW': weekRef=addDays(weekRef,7); render(); break;
    case 'prevM': monthRef=new Date(monthRef.getFullYear(),monthRef.getMonth()-1,1); render(); break;
    case 'nextM': monthRef=new Date(monthRef.getFullYear(),monthRef.getMonth()+1,1); render(); break;
    case 'new': openEditor(null); break;
    case 'edit': openEditor(el.dataset.id); break;
    case 'close': case 'closeBg': edit=null; renderSheet(); break;
    case 'emo': syncName(); edit.emoji=el.dataset.v; renderSheet(); break;
    case 'col': syncName(); edit.color=el.dataset.v; renderSheet(); break;
    case 'stype': syncName(); edit.sched.type=el.dataset.v; renderSheet(); break;
    case 'day': { syncName(); const i=+el.dataset.v, d=edit.sched.days; if(i>=5) break; const p=d.indexOf(i); if(p>=0){if(d.length>1)d.splice(p,1)}else d.push(i); renderSheet(); break; }
    case 'tgt': syncName(); edit.sched.target=Math.min(5,Math.max(1,edit.sched.target+ +el.dataset.v)); renderSheet(); break;
    case 'saveR': {
      syncName(); const name=edit.name.trim();
      if(!name){toast('Give the routine a name');document.getElementById('rname').focus();break}
      const s=edit.sched, sched=s.type==='days'?{type:'days',days:s.days.slice().sort()}:s.type==='weekly'?{type:'weekly',target:s.target}:{type:'daily'};
      if(edit.id){const r=S.routines.find(x=>x.id===edit.id);Object.assign(r,{name,emoji:edit.emoji,color:edit.color,sched});toast('Routine saved')}
      else{S.routines.push({id:'r'+Date.now().toString(36),name,emoji:edit.emoji,color:edit.color,sched,created:key(TODAY())});toast('Routine added')}
      save(); edit=null; renderSheet(); render(); break;
    }
    case 'delR':
      if(!confirmDel){confirmDel=true;syncName();renderSheet();break}
      S.routines=S.routines.filter(r=>r.id!==edit.id);
      for(const k in S.checks){S.checks[k]=S.checks[k].filter(id=>id!==edit.id);if(!S.checks[k].length)delete S.checks[k]}
      save(); edit=null; renderSheet(); render(); toast('Routine deleted'); break;
    case 'showBackup': { const b=document.getElementById('backupBox'); b.hidden=false; document.getElementById('backupText').value=JSON.stringify(S); break; }
    case 'copyBackup': { const ta=document.getElementById('backupText');
      navigator.clipboard?.writeText(ta.value).then(()=>toast('Backup copied'),()=>{ta.select();toast('Select all and copy')}) ?? (ta.select(),toast('Select all and copy')); break; }
    case 'restore': try{ const d=normalize(JSON.parse(document.getElementById('restoreText').value));
        if(!d)throw 0; S={routines:d.routines,checks:d.checks,demo:false}; save(); toast('Backup restored'); view='today'; viewDate=TODAY(); render();
      }catch(err){toast('That code is not a valid backup')} break;
    case 'reset': S=seed(); save(); confirmClear=false; toast('Example data loaded'); render(); break;
    case 'clear': if(!confirmClear){confirmClear=true;render();break}
      S={routines:[],checks:{},demo:false}; save(); confirmClear=false; toast('All data erased'); render(); break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&edit){edit=null;renderSheet()}});
/* when the app is reopened on a new day, move to the new today (yesterday becomes locked) */
let lastDay=key(TODAY());
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;const k=key(TODAY());if(k!==lastDay){if(key(viewDate)===lastDay)viewDate=TODAY();lastDay=k;render()}});
render();
</script>

</body></html>
