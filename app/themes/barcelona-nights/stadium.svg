<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 112">
<!-- Barcelona Nights: the stadium on the lake, where Golem Grad stands in the other looks. Kept's own drawing of a big open bowl in the
     spirit of Camp Nou, seen a little from above: a curved facade of blue and garnet panels, a concrete rim with a ring of lights
     (they shimmer, SMIL), three tiers of seats and the floodlit pitch. An Apple-style rim of light runs along the top. -->
<defs>
  <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".4"/><stop offset=".3" stop-color="#FFFFFF" stop-opacity=".06"/><stop offset="1" stop-color="#000000" stop-opacity=".45"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9D3EA"/><stop offset="1" stop-color="#5D6C9A"/></linearGradient>
  <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5BD17E"/><stop offset="1" stop-color="#1E8E45"/></linearGradient>
  <radialGradient id="flood" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#FFFBE6" stop-opacity=".55"/><stop offset="1" stop-color="#FFFBE6" stop-opacity="0"/></radialGradient>
  <clipPath id="facade"><path d="M4 58L6 96A144 18 0 0 0 294 96L296 58A146 40 0 0 1 4 58Z"/></clipPath>
  <clipPath id="field"><ellipse cx="150" cy="61" rx="78" ry="17"/></clipPath>
  <filter id="glow" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
</defs>
