<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48">
<!-- Barcelona Nights: the theme's own fan badge (not a club crest): a shield with a gold band and a football on top and blue and garnet
     stripes below, a white rim and an Apple-style highlight. It stands on the stadium's far rim like a sign. -->
<defs>
  <clipPath id="shield"><path d="M4 4H36V24C36 35 28 42 20 46C12 42 4 35 4 24Z"/></clipPath>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE27A"/><stop offset="1" stop-color="#D99A00"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".2"/></linearGradient>
</defs>
<path d="M2 2H38V24C38 36.5 29 44 20 48C11 44 2 36.5 2 24Z" fill="#FFFFFF"/>
<g clip-path="url(#shield)">
  <rect x="4" y="16" width="32" height="32" fill="#004D98"/>
  <rect x="8.6" y="16" width="4.6" height="32" fill="#A50044"/><rect x="17.7" y="16" width="4.6" height="32" fill="#A50044"/><rect x="26.8" y="16" width="4.6" height="32" fill="#A50044"/>
  <rect x="4" y="4" width="32" height="12" fill="url(#gold)"/>
  <rect x="4" y="15.2" width="32" height="1.6" fill="#FFFFFF"/>
  <circle cx="20" cy="10" r="4.4" fill="#FFFFFF" stroke="#1B2238" stroke-width=".6"/>
  <path d="M20 7.6L22.1 9.1L21.3 11.6H18.7L17.9 9.1Z" fill="#1B2238"/>
  <rect x="4" y="4" width="32" height="44" fill="url(#gloss)"/>
</g>
<path d="M2.6 2.6H37.4" stroke="#FFFFFF" stroke-width="1"/>
</svg>
