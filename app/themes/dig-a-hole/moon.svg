<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
<!-- Dig a Hole: the pearl moon, a calm face sculpted into a mint pearl with soft airbrush shading; light from the upper left -->
<defs>
  <clipPath id="c"><circle cx="100" cy="100" r="100"/></clipPath>
  <radialGradient id="base" cx="38%" cy="32%" r="78%">
    <stop offset="0" stop-color="#F8FCF4"/><stop offset=".4" stop-color="#D2EEDF"/><stop offset=".76" stop-color="#8CCBAD"/><stop offset="1" stop-color="#4C9879"/>
  </radialGradient>
  <radialGradient id="ball" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#B9DCCB"/></radialGradient>
  <radialGradient id="iris" cx="45%" cy="40%" r="60%"><stop offset="0" stop-color="#9FE3CB"/><stop offset=".55" stop-color="#3E9C80"/><stop offset="1" stop-color="#17463A"/></radialGradient>
  <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6A1CB"/><stop offset=".5" stop-color="#E05C9F"/><stop offset="1" stop-color="#A92A6C"/></linearGradient>
  <linearGradient id="tear" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".9"/><stop offset=".45" stop-color="#BFF0FF" stop-opacity=".35"/><stop offset="1" stop-color="#5CC6EE" stop-opacity=".85"/></linearGradient>
  <filter id="b14" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="b7" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="b4" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="b2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2"/></filter>
  <filter id="b1" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation=".8"/></filter>
  <clipPath id="eyeL"><path d="M53 92Q71 80 90 90Q71 101 53 92Z"/></clipPath>
  <clipPath id="eyeR"><path d="M110 90Q129 80 147 92Q129 101 110 90Z"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <circle cx="100" cy="100" r="100" fill="url(#base)"/>
  <!-- the oily shimmer -->
  <ellipse cx="52" cy="160" rx="46" ry="30" fill="#FF94C8" opacity=".5" filter="url(#b14)"/>
  <ellipse cx="168" cy="62" rx="34" ry="48" fill="#9EDCFF" opacity=".45" filter="url(#b14)"/>
  <ellipse cx="160" cy="160" rx="42" ry="32" fill="#C3B0FF" opacity=".42" filter="url(#b14)"/>
  <ellipse cx="30" cy="70" rx="22" ry="34" fill="#B6FFD8" opacity=".5" filter="url(#b14)"/>
  <!-- the face, turned a little -->
  <g transform="rotate(-5 100 110)">
    <!-- sockets and brow -->
    <ellipse cx="71" cy="90" rx="25" ry="14" fill="#256D51" opacity=".42" filter="url(#b7)"/>
    <ellipse cx="129" cy="90" rx="25" ry="14" fill="#256D51" opacity=".5" filter="url(#b7)"/>
    <ellipse cx="70" cy="73" rx="24" ry="7" fill="#FFFFFF" opacity=".75" filter="url(#b4)"/>
    <ellipse cx="128" cy="73" rx="22" ry="6" fill="#FFFFFF" opacity=".5" filter="url(#b4)"/>
    <!-- cheekbones and blush -->
    <ellipse cx="62" cy="118" rx="16" ry="9" fill="#FFFFFF" opacity=".55" filter="url(#b7)"/>
    <ellipse cx="64" cy="124" rx="15" ry="8" fill="#FF7FBF" opacity=".38" filter="url(#b7)"/>
    <ellipse cx="138" cy="124" rx="15" ry="8" fill="#FF7FBF" opacity=".34" filter="url(#b7)"/>
    <!-- the nose: a lit bridge, a shaded side, the tip and nostrils -->
    <ellipse cx="97" cy="100" rx="5" ry="22" fill="#FFFFFF" opacity=".7" filter="url(#b4)"/>
    <ellipse cx="109" cy="106" rx="6" ry="20" fill="#256D51" opacity=".36" filter="url(#b4)"/>
    <ellipse cx="100" cy="125" rx="15" ry="5" fill="#1E5A44" opacity=".45" filter="url(#b2)"/>
    <ellipse cx="99" cy="117" rx="10" ry="7" fill="#FFFFFF" opacity=".6" filter="url(#b2)"/>
    <ellipse cx="93" cy="122" rx="3.4" ry="2" fill="#1C4F3D" opacity=".75" filter="url(#b1)"/>
    <ellipse cx="107" cy="122" rx="3.4" ry="2" fill="#1C4F3D" opacity=".8" filter="url(#b1)"/>
    <!-- the eyes, heavy-lidded, looking down -->
    <path d="M53 92Q71 80 90 90Q71 101 53 92Z" fill="url(#ball)"/>
    <g clip-path="url(#eyeL)"><circle cx="72" cy="95" r="8" fill="url(#iris)"/><circle cx="72" cy="95" r="3.2" fill="#0D2A22"/><path d="M50 78H94V89Q71 82 50 92Z" fill="#7DBFA2" opacity=".55"/></g>
    <circle cx="69.5" cy="92.5" r="1.7" fill="#FFFFFF"/>
    <path d="M53 92Q71 80 90 90" fill="none" stroke="#14402F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M56 86Q71 76 88 84" fill="none" stroke="#256D51" stroke-width="1.4" opacity=".5" filter="url(#b1)"/>
    <path d="M57 94Q71 100 87 92" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity=".7"/>
    <path d="M110 90Q129 80 147 92Q129 101 110 90Z" fill="url(#ball)"/>
    <g clip-path="url(#eyeR)"><circle cx="128" cy="95" r="8" fill="url(#iris)"/><circle cx="128" cy="95" r="3.2" fill="#0D2A22"/><path d="M106 78H150V92Q129 82 106 89Z" fill="#7DBFA2" opacity=".55"/></g>
    <circle cx="125.5" cy="92.5" r="1.7" fill="#FFFFFF"/>
    <path d="M110 90Q129 80 147 92" fill="none" stroke="#14402F" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M112 84Q129 76 144 86" fill="none" stroke="#256D51" stroke-width="1.4" opacity=".5" filter="url(#b1)"/>
    <path d="M113 92Q129 100 143 94" fill="none" stroke="#FFFFFF" stroke-width="1.3" opacity=".6"/>
    <!-- the lips, pink and glossy -->
    <ellipse cx="100" cy="156" rx="13" ry="3.5" fill="#1E5A44" opacity=".35" filter="url(#b2)"/>
    <path d="M83 142C89 135 95 135 100 139C105 135 111 135 117 142C111 144 105 144 100 144C95 144 89 144 83 142Z" fill="url(#lip)"/>
    <path d="M85 143C92 145 108 145 115 143C112 153 88 153 85 143Z" fill="url(#lip)"/>
    <path d="M83 142C92 144.6 108 144.6 117 142" fill="none" stroke="#7E1A50" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="97" cy="147.5" rx="7" ry="1.8" fill="#FFFFFF" opacity=".8" filter="url(#b1)"/>
    <ellipse cx="93" cy="138.6" rx="3.5" ry="1" fill="#FFFFFF" opacity=".7" filter="url(#b1)"/>
    <ellipse cx="100" cy="168" rx="15" ry="6" fill="#FFFFFF" opacity=".4" filter="url(#b4)"/>
    <!-- a glassy tear on the right cheek -->
    <path d="M139 99Q140 104 139.5 110" fill="none" stroke="#FFFFFF" stroke-width="1.6" opacity=".55" stroke-linecap="round"/>
    <path d="M139.5 108C139.5 113 135 117 135 121A4.6 4.6 0 0 0 144.2 121C144.2 117 139.5 113 139.5 108Z" fill="url(#tear)" stroke="#FFFFFF" stroke-opacity=".8" stroke-width=".6"/>
    <ellipse cx="137.6" cy="120" rx="1.1" ry="2" fill="#FFFFFF"/>
  </g>
  <!-- a wet highlight up top and a rim of light round the edge -->
  <ellipse cx="62" cy="40" rx="28" ry="13" fill="#FFFFFF" opacity=".75" filter="url(#b7)" transform="rotate(-28 62 40)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#FFFFF0" stroke-width="3" opacity=".6" filter="url(#b2)"/>
  <circle cx="100" cy="100" r="100" fill="none" stroke="#1E5A44" stroke-width="10" opacity=".22" filter="url(#b7)"/>
</g>
</svg>
