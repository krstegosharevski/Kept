  <radialGradient id="oB" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#C9EEFF"/><stop offset=".5" stop-color="#3FA7E8"/><stop offset="1" stop-color="#174D80"/></radialGradient>
  <radialGradient id="oS" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#C9D3DD"/><stop offset="1" stop-color="#6D7B8A"/></radialGradient>
  <linearGradient id="star" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6C9"/><stop offset=".5" stop-color="#FFD24A"/><stop offset="1" stop-color="#E59A12"/></linearGradient>
