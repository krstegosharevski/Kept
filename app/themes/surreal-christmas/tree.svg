<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 240">
<!-- Surreal Christmas: the tree. Glossy evergreen tiers with snow on every edge, twinkling light strings, glass baubles and a sleeping star.
     Apple-style edges: a crisp light rim on every shape and soft contact shadows. The lights twinkle and the star glows (SMIL). -->
