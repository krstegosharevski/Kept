<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
<!-- Surreal Christmas: a crescent moon dozing in a Santa hat. The crescent is two circles: outside (56,62) r40, inside (76,50) r34;
     they meet at the horns (56.7,22) and (91.7,80.2). Its face sits on the inner edge. Apple-style rim light; the pom-pom sways (SMIL). -->
<defs>
  <radialGradient id="moon" cx="30%" cy="40%" r="80%"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".5" stop-color="#F8E3A0"/><stop offset="1" stop-color="#D9AE4F"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity=".1"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B7A"/><stop offset=".55" stop-color="#D7263D"/><stop offset="1" stop-color="#8E1426"/></linearGradient>
  <radialGradient id="fluff" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5E1EE"/></radialGradient>
  <filter id="b3" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<path d="M56.7 22A40 40 0 1 0 91.7 80.2A34 34 0 0 1 56.7 22Z" fill="url(#moon)" stroke="url(#rim)" stroke-width="1.4"/>
<!-- craters, softly -->
<circle cx="28" cy="78" r="5" fill="#C99B3E" opacity=".25" filter="url(#b3)"/><circle cx="44" cy="92" r="4" fill="#C99B3E" opacity=".22" filter="url(#b3)"/>
<!-- the face: closed eye, blush, smile -->
<path d="M29 50q4.6 4 9.4 .6" fill="none" stroke="#8A5E14" stroke-width="1.5" stroke-linecap="round"/>
<path d="M30 52.6l-1.4 2.2M33.6 54l-.4 2.4M37 53.2l.8 2.2" fill="none" stroke="#8A5E14" stroke-width=".9" stroke-linecap="round"/>
<ellipse cx="35" cy="62" rx="4.6" ry="2.6" fill="#FF8C8C" opacity=".55"/>
<path d="M40 68q3.4 3 6.6 -1" fill="none" stroke="#8A5E14" stroke-width="1.4" stroke-linecap="round"/>
<!-- the hat on its brow, the tip flopping back over the outer edge -->
<path d="M24 36C14 22 16 6 30 2C42 -1 54 6 58 16L54 26Z" fill="url(#hat)" stroke="#FF9AA5" stroke-opacity=".8" stroke-width=".8"/>
<path d="M22 8C27 3 35 2 42 4" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.3" stroke-linecap="round"/>
<g><circle cx="12" cy="26" r="5.4" fill="url(#fluff)" stroke="#FFFFFF" stroke-width=".7"/>
  <path d="M24 10C16 10 12 16 12 21" fill="none" stroke="#D7263D" stroke-width="5" stroke-linecap="round"/>
  <animateTransform attributeName="transform" type="rotate" values="-6 24 10;6 24 10;-6 24 10" dur="3.4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/></g>
<rect x="18" y="28" width="42" height="9" rx="4.5" fill="url(#fluff)" stroke="#FFFFFF" stroke-width=".7" transform="rotate(-24 39 32.5)"/>
</svg>
