<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kept</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kept">
<!-- "default" keeps the time and battery dark on the light background; black-translucent would make them white and unreadable -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script type="module" src="js/ui.js"></script>
</head>
<body>
<header class="navbar"><img src="icons/icon.svg" alt="" width="28" height="28"><span>Kept</span></header>
<canvas id="water" aria-hidden="true"></canvas>
<div class="app" id="app"></div>

<div class="tabs glass"><nav id="tabs" aria-label="Sections">
  <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><mask id="tick"><rect width="24" height="24" fill="#fff"/><path d="m7.6 12.4 3 3 5.8-6.4" fill="none" stroke="#000" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></mask><circle cx="12" cy="12" r="10" fill="currentColor" mask="url(#tick)"/></svg><span>Today</span></button>
  <button data-tab="routines"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><circle cx="4.5" cy="6" r="1.7"/><circle cx="4.5" cy="12" r="1.7"/><circle cx="4.5" cy="18" r="1.7"/></g><path d="M9.5 6h11M9.5 12h11M9.5 18h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Routines</span></button>
  <button data-tab="stats"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3.5" y="12" width="4.6" height="8.5" rx="1.5"/><rect x="9.7" y="3.5" width="4.6" height="17" rx="1.5"/><rect x="15.9" y="8" width="4.6" height="12.5" rx="1.5"/></svg><span>Stats</span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4" fill="none" stroke="currentColor" stroke-width="3.2" stroke-dasharray="3.3 3.3" stroke-dashoffset="1.65"/><path fill="currentColor" fill-rule="evenodd" d="M12 4.6a7.4 7.4 0 1 1 0 14.8 7.4 7.4 0 0 1 0-14.8zm0 4.3a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2z"/></svg><span>Settings</span></button>
</nav></div>

<div id="sheetRoot"></div>
<div class="toast glass" id="toast" role="status" hidden></div>
</body>
</html>
