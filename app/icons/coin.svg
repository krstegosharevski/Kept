<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 208">
<!-- Kept's currency, the Pelican Coin (Shop): white enamel in a polished gold rim, a big Dalmatian pelican head in relief with the curly Prespa crest, and its orange pouch. -->
<defs>
  <radialGradient id="face" cx="38%" cy="30%" r="82%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F7F6F2"/><stop offset="1" stop-color="#E4E1D8"/></radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF4C7"/><stop offset=".25" stop-color="#E9B83A"/><stop offset=".5" stop-color="#FFF0B8"/><stop offset=".75" stop-color="#C98B12"/><stop offset="1" stop-color="#8F5E0A"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6B743"/><stop offset="1" stop-color="#7A4E08"/></linearGradient>
  <linearGradient id="relief" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E4DFD3"/></linearGradient>
  <linearGradient id="bill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF3DF"/><stop offset="1" stop-color="#D9C08E"/></linearGradient>
  <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB25C"/><stop offset="1" stop-color="#F0592A"/></linearGradient>
  <clipPath id="inner"><circle cx="100" cy="100" r="79"/></clipPath>
  <filter id="soft" x="-30%" y="-200%" width="160%" height="500%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="gloss" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="raise" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="b"/><feOffset in="b" dx="1.6" dy="2.4" result="o"/>
    <feFlood flood-color="#55452A" flood-opacity=".4"/><feComposite in2="o" operator="in" result="sh"/>
    <feOffset in="SourceAlpha" dx="-.9" dy="-1.1" result="h0"/><feFlood flood-color="#FFFFFF"/><feComposite in2="h0" operator="in" result="hi"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="hi"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<ellipse cx="100" cy="197" rx="70" ry="5" fill="#0B1220" opacity=".26" filter="url(#soft)"/>
<circle cx="100" cy="106" r="92" fill="url(#edge)"/>
<circle cx="100" cy="100" r="92" fill="url(#gold)"/>
<circle cx="100" cy="100" r="91.4" fill="none" stroke="#FFF6D6" stroke-width="1" opacity=".8"/>
<circle cx="100" cy="100" r="80.5" fill="#8F5E0A" opacity=".55"/>
<circle cx="100" cy="100" r="79" fill="url(#face)"/>
<g clip-path="url(#inner)">
  <g filter="url(#raise)">
    <path fill="url(#relief)" d="M58 84C50 112 70 138 58 196H96C98 150 80 124 90 96Z"/>
    <path fill="url(#relief)" d="M56 70C46 70 41 62 45 55C47 60 51 62 55 61C50 57 50 50 55 47C56 53 60 56 64 56Z"/>
    <ellipse fill="url(#relief)" cx="74" cy="76" rx="22" ry="19"/>
    <path fill="url(#pouch)" d="M86 80L156 129Q147 142 124 141Q100 138 86 112Q80 96 86 80Z"/>
    <path fill="url(#bill)" d="M85 65L160 121Q170 127 165.5 132.5Q161.5 135.5 157.5 131L84 81Z"/>
  </g>
  <path fill="none" stroke="#FFFFFF" stroke-width="1" opacity=".8" stroke-linecap="round" d="M90 70L156 119"/>
  <path fill="none" stroke="#C9472A" stroke-width="1" opacity=".35" stroke-linecap="round" d="M92 98Q108 124 132 130"/>
  <circle cx="80" cy="71" r="3.6" fill="#F6E7A8" stroke="#EBA9B2" stroke-width="1.6"/>
  <circle cx="80.4" cy="71" r="1.5" fill="#1E2530"/>
  <circle cx="79.4" cy="70" r=".6" fill="#FFFFFF"/>
</g>
<circle cx="100" cy="100" r="79" fill="none" stroke="#FFF0B8" stroke-width=".8" opacity=".7"/>
<ellipse cx="68" cy="46" rx="36" ry="14" transform="rotate(-32 68 46)" fill="#FFFFFF" opacity=".55" filter="url(#gloss)"/>
</svg>
